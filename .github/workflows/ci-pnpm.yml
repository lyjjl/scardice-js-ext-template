# CI: 使用 pnpm 安装并构建
# 说明：此工作流在 push 到主分支或 PR 时触发，使用 Node.js 环境并通过 pnpm 安装依赖与构建。
name: CI (pnpm)

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: 构建 (pnpm)
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # ────────────────────────────────────────────────────────────
      # 解决方案：使用官方 pnpm/action-setup@v4，比 corepack 在 CI 中稳定得多，
      # 并且必须在 actions/setup-node 之前运行，以允许其正确初始化 pnpm 并自动完成依赖缓存。
      # ────────────────────────────────────────────────────────────
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: 安装依赖 (pnpm)
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm run build

      - name: 运行 Biome 检查（CI）
        run: pnpm run biome:ci

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: build-output
          path: dist/
          retention-days: 7
